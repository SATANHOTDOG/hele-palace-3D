<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>和樂宮 3D｜四向家具實拍＋AI自動去背相機</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161a22;
      --border: #333b48;
      --gold: #f5b942;
      --green: #22c55e;
      --cyan: #38bdf8;
      --danger: #ef4444;
      --text: #f3f4f6;
      --sub: #9ca3af;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }

    /* ================= 頂部設定列 ================= */
    #top-bar {
      flex: 0 0 auto;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 25;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .name-row label {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }

    #base-filename {
      flex: 1;
      background: #0d1015;
      border: 1px solid #444e5e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      outline: none;
      user-select: text;
      min-width: 0;
    }
    #base-filename:focus { border-color: var(--gold); }

    .btn-mini {
      background: #252c37;
      border: 1px solid #444e5e;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 7px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-mini.locked {
      background: rgba(245, 185, 66, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }
    .btn-mini.unlocked {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .angle-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .angle-tab {
      background: #1e232d;
      border: 1.5px solid #353e4d;
      border-radius: 7px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .angle-tab.active {
      border-color: var(--gold);
      background: rgba(245, 185, 66, 0.16);
    }
    .angle-tab.done {
      border-color: var(--green);
    }
    .angle-tab .deg {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }
    .angle-tab .fname {
      font-size: 9.5px;
      color: var(--sub);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .angle-tab .badge {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 9px;
    }

    /* ================= 主體取景區 ================= */
    #main-stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    #viewfinder {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #cam-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #ghost-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 4;
    }

    /* 四邊暗化遮罩 */
    .crop-mask {
      position: absolute;
      background: rgba(0, 0, 0, 0.62);
      pointer-events: none;
      z-index: 5;
    }
    #mask-top { top: 0; left: 0; right: 0; }
    #mask-bottom { bottom: 0; left: 0; right: 0; }
    #mask-left { left: 0; }
    #mask-right { right: 0; }

    #guide-center-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      border-left: 1px dashed rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 6;
    }

    #roll-level-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 20px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
    }
    #roll-bar {
      width: 84px;
      height: 2.5px;
      border-radius: 2px;
      background: rgba(245, 185, 66, 0.85);
      transition: transform 0.06s linear, background 0.15s;
    }
    #roll-bar.level {
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
    }

    /* 可拖曳四邊線 */
    .drag-hline {
      position: absolute;
      left: 0;
      right: 0;
      height: 34px;
      margin-top: -17px;
      cursor: ns-resize;
      z-index: 12;
      display: flex;
      align-items: center;
    }
    .drag-hline .bar {
      width: 100%;
      height: 2.5px;
    }
    #line-top .bar { background: var(--gold); box-shadow: 0 0 6px #000; }
    #line-top .tag {
      position: absolute;
      left: 8px;
      top: -12px;
      font-size: 10.5px;
      font-weight: 800;
      color: #111;
      background: var(--gold);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }
    #line-bottom .bar { background: var(--green); box-shadow: 0 0 6px #000; }
    #line-bottom .tag {
      position: absolute;
      left: 8px;
      top: 18px;
      font-size: 10.5px;
      font-weight: 800;
      color: #052e16;
      background: var(--green);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .drag-vline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 34px;
      margin-left: -17px;
      cursor: ew-resize;
      z-index: 12;
      display: flex;
      justify-content: center;
    }
    .drag-vline .bar {
      height: 100%;
      width: 2.5px;
      background: var(--cyan);
      box-shadow: 0 0 6px #000;
    }
    .drag-vline .vtag {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 800;
      color: #082f49;
      background: var(--cyan);
      padding: 3px 4px;
      border-radius: 4px;
      pointer-events: none;
    }

    #status-pill {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 18, 24, 0.9);
      border: 1px solid var(--border);
      color: #fef3c7;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 94%;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 16;
    }

    /* AI 去背處理中遮罩 */
    #ai-loading {
      position: absolute;
      inset: 0;
      background: rgba(10, 13, 18, 0.84);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 30;
      backdrop-filter: blur(4px);
    }
    #ai-loading.show { display: flex; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(245, 185, 66, 0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #ai-loading-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold);
      text-align: center;
      padding: 0 20px;
    }
    #ai-loading-sub {
      font-size: 11px;
      color: var(--sub);
      text-align: center;
      padding: 0 24px;
    }

    /* ================= 快門與操作列 ================= */
    #control-bar {
      flex: 0 0 auto;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .btn-sub {
      flex: 1;
      padding: 9px 6px;
      border-radius: 9px;
      border: 1px solid #444e5e;
      background: #232a35;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .btn-sub.ready {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80;
      color: #fff;
    }

    #shutter-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #4b5563;
      box-shadow: 0 0 0 3px rgba(245, 185, 66, 0.55);
      cursor: pointer;
      flex: 0 0 auto;
      transition: transform 0.08s;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      background: var(--gold);
    }

    @media (orientation: landscape) {
      #top-bar {
        flex-direction: row;
        align-items: center;
        padding: 4px 10px;
        gap: 8px;
      }
      .name-row { flex: 0 0 270px; }
      .angle-tabs { flex: 1; }
      .angle-tab { padding: 2px 4px; }
      #main-stage { flex-direction: row; }
      #control-bar {
        flex-direction: column;
        width: 88px;
        border-top: none;
        border-left: 1px solid var(--border);
        padding: 10px 6px;
        padding-right: calc(6px + var(--safe-right));
      }
      .btn-sub {
        flex: 0 0 auto;
        width: 100%;
        font-size: 11px;
        padding: 8px 4px;
        white-space: normal;
        line-height: 1.25;
      }
    }

    /* ================= 通用彈窗基底 ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 50;
      backdrop-filter: blur(5px);
    }
    .modal-backdrop.show { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 92dvh;
      background: #1a2029;
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      padding: 10px 14px;
      background: #222935;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 {
      margin: 0;
      font-size: 15px;
      color: var(--gold);
    }

    .modal-body {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 棋盤格透明背景樣式 */
    .checker-bg {
      background-color: #1f242d;
      background-image:
        linear-gradient(45deg, #2b323e 25%, transparent 25%),
        linear-gradient(-45deg, #2b323e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b323e 75%),
        linear-gradient(-45deg, transparent 75%, #2b323e 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    /* 底色切換列 */
    .bg-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #12161d;
      padding: 7px 9px;
      border-radius: 9px;
      border: 1px solid #2e3644;
      flex-wrap: wrap;
    }
    .bg-picker-row span {
      font-size: 11.5px;
      font-weight: 700;
      color: #d1d5db;
    }
    .swatch-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .swatch-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 2px solid #4b5563;
      cursor: pointer;
      padding: 0;
    }
    .swatch-btn.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245, 185, 66, 0.45);
      transform: scale(1.06);
    }
    .swatch-custom {
      width: 28px;
      height: 28px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    /* ================= 單張即時確認卡 ================= */
    #single-preview-box {
      width: 100%;
      height: 44dvh;
      max-height: 320px;
      border-radius: 10px;
      border: 1px solid #3a4352;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }
    #single-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #single-preview-box::after {
      content: "底座基準線";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-bottom: 2px solid var(--green);
      font-size: 10px;
      font-weight: 800;
      color: var(--green);
      padding-left: 6px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
      pointer-events: none;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 8px;
    }
    .btn-retake {
      padding: 12px 8px;
      border-radius: 10px;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-accept {
      padding: 12px 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ================= 四向總覽視窗 ================= */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .compare-card {
      background: #101318;
      border: 1px solid #353e4d;
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .compare-img-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .compare-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .compare-img-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--green);
    }

    .compare-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
    }

    .btn-dl-one {
      background: #0284c7;
      border: none;
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-dl-one:disabled {
      background: #374151;
      color: #9ca3af;
    }

    .btn-dl-all {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- 頂部設定與四向狀態 -->
  <header id="top-bar">
    <div class="name-row">
      <label for="base-filename">檔名</label>
      <input type="text" id="base-filename" value="LaZBoy" placeholder="例: LaZBoy" />
      <button class="btn-mini unlocked" id="btn-lock-v">🔓 上下自由</button>
      <button class="btn-mini" id="btn-ghost-toggle">👻 殘影: 關</button>
      <button class="btn-mini" id="btn-reset-all">🗑️ 重設</button>
    </div>
    <div class="angle-tabs" id="angle-tabs">
      <div class="angle-tab active" data-idx="0">
        <span class="badge" id="badge-0"></span>
        <span class="deg">0° 正面</span>
        <span class="fname" id="fname-0">LaZBoy.png</span>
      </div>
      <div class="angle-tab" data-idx="1">
        <span class="badge" id="badge-1"></span>
        <span class="deg">90° 右側</span>
        <span class="fname" id="fname-1">LaZBoy_90.png</span>
      </div>
      <div class="angle-tab" data-idx="2">
        <span class="badge" id="badge-2"></span>
        <span class="deg">180° 背面</span>
        <span class="fname" id="fname-2">LaZBoy_180.png</span>
      </div>
      <div class="angle-tab" data-idx="3">
        <span class="badge" id="badge-3"></span>
        <span class="deg">270° 左側</span>
        <span class="fname" id="fname-3">LaZBoy_270.png</span>
      </div>
    </div>
  </header>

  <div id="main-stage">
    <!-- 相機取景區 -->
    <main id="viewfinder">
      <video id="cam-video" autoplay playsinline muted></video>
      <img id="ghost-overlay" alt="" />

      <!-- 四邊暗化遮罩 -->
      <div class="crop-mask" id="mask-top"></div>
      <div class="crop-mask" id="mask-bottom"></div>
      <div class="crop-mask" id="mask-left"></div>
      <div class="crop-mask" id="mask-right"></div>

      <div id="guide-center-v"></div>
      <div id="roll-level-wrap"><div id="roll-bar"></div></div>

      <!-- 四條可拖曳裁切線 -->
      <div class="drag-hline" id="line-top">
        <div class="bar"></div>
        <span class="tag">▲ 拖曳貼齊椅背頂端</span>
      </div>
      <div class="drag-hline" id="line-bottom">
        <div class="bar"></div>
        <span class="tag">▼ 拖曳貼齊底座觸地線</span>
      </div>
      <div class="drag-vline" id="line-left">
        <div class="bar"></div>
        <span class="vtag">◀</span>
      </div>
      <div class="drag-vline" id="line-right">
        <div class="bar"></div>
        <span class="vtag">▶</span>
      </div>

      <div id="status-pill">拖動四邊框線貼齊家具四邊，按下快門將自動去背</div>

      <!-- AI 去背處理遮罩 -->
      <div id="ai-loading">
        <div class="spinner"></div>
        <div id="ai-loading-text">✨ 正在自動去背中...</div>
        <div id="ai-loading-sub">首次開啟需下載 AI 去背模型（約 40MB），之後會自動快取秒開</div>
      </div>
    </main>

    <!-- 快門與預覽列 -->
    <footer id="control-bar">
      <button class="btn-sub" id="btn-sensor">📐 水平儀</button>
      <button id="shutter-btn" title="拍照並自動去背"></button>
      <button class="btn-sub" id="btn-review">🖼️ 總覽/下載 (0/4)</button>
    </footer>
  </div>
</div>

<!-- 單張拍完即時確認卡 -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="confirm-title">✨ 單張去背確認（0° 正面）</h3>
      <button class="btn-mini" id="btn-toggle-raw">✨ 目前: AI去背</button>
    </div>
    <div class="modal-body">
      <div id="single-preview-box" class="checker-bg">
        <img id="single-preview-img" alt="去背預覽" />
      </div>

      <div class="bg-picker-row">
        <span>預覽/匯出底色：</span>
        <div class="swatch-group" id="confirm-swatches">
          <button class="swatch-btn checker-bg active" data-bg="transparent" title="透明底（3D專用）"></button>
          <button class="swatch-btn" data-bg="#00e676" style="background:#00e676;" title="亮綠幕檢查邊緣"></button>
          <button class="swatch-btn" data-bg="#111111" style="background:#111111;" title="純黑底檢查淺色邊緣"></button>
          <button class="swatch-btn" data-bg="#ffffff" style="background:#ffffff;" title="純白底商品圖"></button>
          <input type="color" class="swatch-custom" id="confirm-custom-color" value="#f3f4f6" title="自訂底色" />
        </div>
      </div>

      <div class="confirm-actions">
        <button class="btn-retake" id="btn-single-retake">🔄 重拍此張</button>
        <button class="btn-accept" id="btn-single-accept">✅ 確認，拍下一面</button>
      </div>
    </div>
  </div>
</div>

<!-- 四向總覽並排檢查與打包下載視窗 -->
<div class="modal-backdrop" id="review-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>📐 四向對齊總覽與打包下載</h3>
      <button class="btn-mini" id="btn-close-review">✕ 關閉</button>
    </div>
    <div class="modal-body">
      <div class="bg-picker-row">
        <span>輸出檔案底色：</span>
        <div class="swatch-group" id="review-swatches">
          <button class="swatch-btn checker-bg active" data-bg="transparent" title="透明 PNG（和樂宮 3D 專用）"></button>
          <button class="swatch-btn" data-bg="#ffffff" style="background:#ffffff;" title="純白底 PNG（傳給客人）"></button>
          <button class="swatch-btn" data-bg="#00e676" style="background:#00e676;" title="亮綠幕 PNG"></button>
          <button class="swatch-btn" data-bg="#111111" style="background:#111111;" title="純黑底 PNG"></button>
          <input type="color" class="swatch-custom" id="review-custom-color" value="#f5f5f4" title="自訂底色" />
        </div>
      </div>

      <div class="compare-grid" id="compare-grid"></div>

      <button class="btn-dl-all" id="btn-dl-zip">📦 一鍵打包下載 ZIP（全部已拍圖檔）</button>
      <div style="font-size:11px;color:#9ca3af;text-align:center;">
        匯入「和樂宮 3D」請選<strong>透明格紋</strong>底色打包；下載 ZIP 後於手機「我的檔案」解壓縮即可上傳 GitHub。
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { removeBackground } from "https://esm.sh/@imgly/background-removal@1.5.5";

  const ANGLES = [
    { idx: 0, label: "0° 正面", suffix: "" },
    { idx: 1, label: "90° 右側", suffix: "_90" },
    { idx: 2, label: "180° 背面", suffix: "_180" },
    { idx: 3, label: "270° 左側", suffix: "_270" }
  ];

  // shots[idx] = { rawUrl, nobgUrl, useNobg }
  const state = {
    currentIdx: 0,
    shots: [null, null, null, null],
    topPct: 22,
    bottomPct: 82,
    leftPct: 12,
    rightPct: 88,
    verticalLocked: false,
    ghostMode: 0,
    bgColor: "transparent", // "transparent" 或 "#xxxxxx"
    isProcessing: false
  };

  const video = document.getElementById("cam-video");
  const viewfinder = document.getElementById("viewfinder");
  const ghostImg = document.getElementById("ghost-overlay");
  const statusPill = document.getElementById("status-pill");
  const baseInput = document.getElementById("base-filename");
  const btnLockV = document.getElementById("btn-lock-v");

  const lineTop = document.getElementById("line-top");
  const lineBottom = document.getElementById("line-bottom");
  const lineLeft = document.getElementById("line-left");
  const lineRight = document.getElementById("line-right");

  const maskTop = document.getElementById("mask-top");
  const maskBottom = document.getElementById("mask-bottom");
  const maskLeft = document.getElementById("mask-left");
  const maskRight = document.getElementById("mask-right");

  // 1. 啟動後置鏡頭
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
    } catch (err) {
      statusPill.textContent = "⚠️ 無法開啟相機，請確認網址為 HTTPS 並允許相機權限";
    }
  }

  // 2. 左右水平儀
  function handleOrientation(e) {
    if (typeof e.beta !== "number" || typeof e.gamma !== "number") return;
    const isLandscape = window.innerWidth > window.innerHeight;
    const roll = isLandscape ? e.beta : e.gamma;
    const rollBar = document.getElementById("roll-bar");
    const clamped = Math.max(-20, Math.min(20, roll));
    rollBar.style.transform = `rotate(${-clamped}deg)`;
    rollBar.classList.toggle("level", Math.abs(roll) <= 1.8);
  }

  window.addEventListener("deviceorientation", handleOrientation);
  document.getElementById("btn-sensor").addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          statusPill.textContent = "✅ 已啟用水平儀（中央橫線變綠代表端平）";
        }
      } catch (_) {}
    } else {
      statusPill.textContent = "✅ 水平儀運作中（中央橫線變綠代表手機左右端平）";
    }
  });

  // 3. 上下線鎖定 / 解鎖切換鈕
  function setVerticalLock(locked) {
    state.verticalLocked = locked;
    if (locked) {
      btnLockV.textContent = "🔒 上下已鎖";
      btnLockV.className = "btn-mini locked";
    } else {
      btnLockV.textContent = "🔓 上下自由";
      btnLockV.className = "btn-mini unlocked";
    }
  }

  btnLockV.addEventListener("click", () => {
    setVerticalLock(!state.verticalLocked);
    statusPill.textContent = state.verticalLocked
      ? "🔒 已鎖定上下高度線（確保各面高度一致）"
      : "🔓 已解鎖上下線！現在可單獨上下拖動橘線與綠線";
  });

  // 4. 更新四邊框線與暗化遮罩
  function updateCropBoxUI() {
    lineTop.style.top = `${state.topPct}%`;
    lineBottom.style.top = `${state.bottomPct}%`;
    lineLeft.style.left = `${state.leftPct}%`;
    lineRight.style.left = `${state.rightPct}%`;

    maskTop.style.height = `${state.topPct}%`;
    maskBottom.style.height = `${100 - state.bottomPct}%`;

    const midTop = `${state.topPct}%`;
    const midHeight = `${state.bottomPct - state.topPct}%`;
    maskLeft.style.top = midTop;
    maskLeft.style.height = midHeight;
    maskLeft.style.width = `${state.leftPct}%`;

    maskRight.style.top = midTop;
    maskRight.style.height = midHeight;
    maskRight.style.width = `${100 - state.rightPct}%`;

    ghostImg.style.left = `${state.leftPct}%`;
    ghostImg.style.top = `${state.topPct}%`;
    ghostImg.style.width = `${state.rightPct - state.leftPct}%`;
    ghostImg.style.height = `${state.bottomPct - state.topPct}%`;
  }

  function bindEdgeDrag(el, edge) {
    let dragging = false;
    const onMove = (clientX, clientY) => {
      if (!dragging) return;
      const rect = viewfinder.getBoundingClientRect();
      const xPct = ((clientX - rect.left) / rect.width) * 100;
      const yPct = ((clientY - rect.top) / rect.height) * 100;

      if (edge === "top" || edge === "bottom") {
        if (state.verticalLocked) {
          statusPill.textContent = "🔒 上下高度已鎖定，若走道太窄請點上方「🔒 上下已鎖」解鎖微調";
          dragging = false;
          return;
        }
        if (edge === "top") {
          state.topPct = Math.max(2, Math.min(state.bottomPct - 10, yPct));
        } else {
          state.bottomPct = Math.min(98, Math.max(state.topPct + 10, yPct));
        }
      } else if (edge === "left") {
        state.leftPct = Math.max(2, Math.min(state.rightPct - 10, xPct));
      } else if (edge === "right") {
        state.rightPct = Math.min(98, Math.max(state.leftPct + 10, xPct));
      }
      updateCropBoxUI();
    };

    el.addEventListener("touchstart", (e) => { dragging = true; e.preventDefault(); }, { passive: false });
    window.addEventListener("touchmove", (e) => {
      if (dragging && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("touchend", () => { dragging = false; });

    el.addEventListener("mousedown", () => { dragging = true; });
    window.addEventListener("mousemove", (e) => {
      if (dragging) onMove(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", () => { dragging = false; });
  }

  bindEdgeDrag(lineTop, "top");
  bindEdgeDrag(lineBottom, "bottom");
  bindEdgeDrag(lineLeft, "left");
  bindEdgeDrag(lineRight, "right");

  // 5. 檔名與分頁更新
  function getCleanBaseName() {
    return (baseInput.value.trim() || "Furniture").replace(/[^a-zA-Z0-9_-]/g, "");
  }

  function getActiveShotUrl(shot) {
    if (!shot) return null;
    return (shot.useNobg && shot.nobgUrl) ? shot.nobgUrl : shot.rawUrl;
  }

  function refreshTabsUI() {
    const base = getCleanBaseName();
    ANGLES.forEach(a => {
      const tab = document.querySelector(`.angle-tab[data-idx="${a.idx}"]`);
      const fnameEl = document.getElementById(`fname-${a.idx}`);
      const badgeEl = document.getElementById(`badge-${a.idx}`);
      fnameEl.textContent = `${base}${a.suffix}.png`;
      tab.classList.toggle("active", state.currentIdx === a.idx);
      const hasShot = Boolean(state.shots[a.idx]);
      tab.classList.toggle("done", hasShot);
      badgeEl.textContent = hasShot ? "✅" : "";
    });

    const count = state.shots.filter(Boolean).length;
    const reviewBtn = document.getElementById("btn-review");
    reviewBtn.textContent = `🖼️ 總覽/下載 (${count}/4)`;
    reviewBtn.classList.toggle("ready", count === 4);

    updateGhostOverlay();
  }

  baseInput.addEventListener("input", refreshTabsUI);

  document.querySelectorAll(".angle-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.currentIdx = parseInt(tab.dataset.idx);
      refreshTabsUI();
      statusPill.textContent = `目前角度：${ANGLES[state.currentIdx].label}（拉緊左右藍線對準後按快門）`;
    });
  });

  // 6. 洋蔥皮殘影
  const GHOST_LEVELS = [
    { opacity: 0, label: "👻 殘影: 關" },
    { opacity: 0.35, label: "👻 殘影: 35%" },
    { opacity: 0.55, label: "👻 殘影: 55%" }
  ];

  function updateGhostOverlay() {
    const refShot = state.shots[0] || state.shots.find(Boolean);
    const refUrl = getActiveShotUrl(refShot);
    const level = GHOST_LEVELS[state.ghostMode];
    if (refUrl && level.opacity > 0 && state.currentIdx !== 0) {
      ghostImg.src = refUrl;
      ghostImg.style.opacity = String(level.opacity);
    } else {
      ghostImg.style.opacity = "0";
    }
  }

  document.getElementById("btn-ghost-toggle").addEventListener("click", () => {
    state.ghostMode = (state.ghostMode + 1) % GHOST_LEVELS.length;
    document.getElementById("btn-ghost-toggle").textContent = GHOST_LEVELS[state.ghostMode].label;
    updateGhostOverlay();
  });

  // 7. 底色選擇器同步（確認卡與總覽視窗共用）
  function applyPreviewBackground(containerEl, bgColor) {
    if (bgColor === "transparent") {
      containerEl.classList.add("checker-bg");
      containerEl.style.backgroundColor = "";
    } else {
      containerEl.classList.remove("checker-bg");
      containerEl.style.backgroundColor = bgColor;
    }
  }

  function syncBgSwatches(bgColor) {
    state.bgColor = bgColor;
    document.querySelectorAll(".swatch-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.bg === bgColor);
    });
    applyPreviewBackground(document.getElementById("single-preview-box"), bgColor);
    document.querySelectorAll(".compare-img-wrap").forEach(wrap => {
      applyPreviewBackground(wrap, bgColor);
    });
  }

  document.querySelectorAll(".swatch-btn").forEach(btn => {
    btn.addEventListener("click", () => syncBgSwatches(btn.dataset.bg));
  });
  document.getElementById("confirm-custom-color").addEventListener("input", (e) => {
    syncBgSwatches(e.target.value);
  });
  document.getElementById("review-custom-color").addEventListener("input", (e) => {
    syncBgSwatches(e.target.value);
  });

  // 8. 單張即時確認卡邏輯
  function openConfirmModal(idx) {
    const shot = state.shots[idx];
    if (!shot) return;

    document.getElementById("confirm-title").textContent = `✨ 單張去背確認（${ANGLES[idx].label}）`;
    const previewImg = document.getElementById("single-preview-img");
    const toggleBtn = document.getElementById("btn-toggle-raw");

    const updateSingleView = () => {
      previewImg.src = getActiveShotUrl(shot);
      if (shot.nobgUrl) {
        toggleBtn.disabled = false;
        toggleBtn.textContent = shot.useNobg ? "✨ 目前: AI去背" : "📷 目前: 原始裁切";
      } else {
        toggleBtn.disabled = true;
        toggleBtn.textContent = "📷 原始裁切圖";
      }
    };

    toggleBtn.onclick = () => {
      shot.useNobg = !shot.useNobg;
      updateSingleView();
      refreshTabsUI();
    };

    updateSingleView();
    applyPreviewBackground(document.getElementById("single-preview-box"), state.bgColor);

    const anyEmptyAfter = state.shots.some((s, i) => i !== idx && !s);
    document.getElementById("btn-single-accept").textContent = anyEmptyAfter
      ? "✅ 確認，拍下一面"
      : "🎉 確認，開啟總覽下載";

    document.getElementById("confirm-modal").classList.add("show");
  }

  document.getElementById("btn-single-retake").addEventListener("click", () => {
    const old = state.shots[state.currentIdx];
    if (old) {
      if (old.rawUrl) URL.revokeObjectURL(old.rawUrl);
      if (old.nobgUrl) URL.revokeObjectURL(old.nobgUrl);
    }
    state.shots[state.currentIdx] = null;
    document.getElementById("confirm-modal").classList.remove("show");
    refreshTabsUI();
    statusPill.textContent = `🔄 請重新對準【${ANGLES[state.currentIdx].label}】按快門`;
  });

  document.getElementById("btn-single-accept").addEventListener("click", () => {
    document.getElementById("confirm-modal").classList.remove("show");

    // 確認第 1 張後自動鎖定上下高度線
    if (state.currentIdx === 0 && !state.verticalLocked) {
      setVerticalLock(true);
    }

    const nextEmpty = state.shots.findIndex((s, i) => i > state.currentIdx && !s);
    const anyEmpty = state.shots.findIndex(s => !s);
    if (nextEmpty !== -1) {
      state.currentIdx = nextEmpty;
      refreshTabsUI();
      statusPill.textContent = `✅ 請移動至【${ANGLES[state.currentIdx].label}】（上下已鎖，可調左右藍線）`;
    } else if (anyEmpty !== -1) {
      state.currentIdx = anyEmpty;
      refreshTabsUI();
      statusPill.textContent = `✅ 請補拍【${ANGLES[state.currentIdx].label}】`;
    } else {
      refreshTabsUI();
      openReviewModal();
    }
  });

  // 9. 快門拍照 ＋ 自動 AI 去背
  document.getElementById("shutter-btn").addEventListener("click", async () => {
    if (state.isProcessing) return;
    if (!video.videoWidth || !video.videoHeight) {
      statusPill.textContent = "⏳ 相機畫面尚未就緒，請稍候...";
      return;
    }

    state.isProcessing = true;
    const loadingEl = document.getElementById("ai-loading");
    const loadingText = document.getElementById("ai-loading-text");
    const loadingSub = document.getElementById("ai-loading-sub");
    loadingText.textContent = "✨ 正在自動去背中...";
    loadingSub.textContent = "首次執行需下載 AI 模型（約 40MB），之後會快取在手機中";
    loadingEl.classList.add("show");

    try {
      const viewW = viewfinder.clientWidth;
      const viewH = viewfinder.clientHeight;
      const vidRatio = video.videoWidth / video.videoHeight;
      const viewRatio = viewW / viewH;

      let visibleVidX = 0, visibleVidY = 0, visibleVidW = video.videoWidth, visibleVidH = video.videoHeight;
      if (vidRatio > viewRatio) {
        visibleVidW = video.videoHeight * viewRatio;
        visibleVidX = (video.videoWidth - visibleVidW) / 2;
      } else {
        visibleVidH = video.videoWidth / viewRatio;
        visibleVidY = (video.videoHeight - visibleVidH) / 2;
      }

      const cropX = visibleVidX + visibleVidW * (state.leftPct / 100);
      const cropY = visibleVidY + visibleVidH * (state.topPct / 100);
      const cropW = visibleVidW * ((state.rightPct - state.leftPct) / 100);
      const cropH = visibleVidH * ((state.bottomPct - state.topPct) / 100);

      const maxDim = 1200;
      let outW = Math.max(10, Math.round(cropW));
      let outH = Math.max(10, Math.round(cropH));
      if (Math.max(outW, outH) > maxDim) {
        const scale = maxDim / Math.max(outW, outH);
        outW = Math.round(outW * scale);
        outH = Math.round(outH * scale);
      }

      const capCanvas = document.createElement("canvas");
      capCanvas.width = outW;
      capCanvas.height = outH;
      const cctx = capCanvas.getContext("2d");
      cctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

      const rawBlob = await new Promise(res => capCanvas.toBlob(res, "image/png"));
      const rawUrl = URL.createObjectURL(rawBlob);

      let nobgUrl = null;
      try {
        const nobgBlob = await removeBackground(rawBlob, {
          model: "isnet_quint8",
          output: { format: "image/png" },
          progress: (key, current, total) => {
            if (total > 0) {
              const pct = Math.min(100, Math.round((current / total) * 100));
              loadingSub.textContent = `AI 處理進度：${pct}%`;
            }
          }
        });
        nobgUrl = URL.createObjectURL(nobgBlob);
      } catch (aiErr) {
        console.warn("AI 去背失敗，保留原裁切圖：", aiErr);
        statusPill.textContent = "⚠️ AI 去背模型載入受限，已保留精準裁切原圖";
      }

      const prev = state.shots[state.currentIdx];
      if (prev) {
        if (prev.rawUrl) URL.revokeObjectURL(prev.rawUrl);
        if (prev.nobgUrl) URL.revokeObjectURL(prev.nobgUrl);
      }

      state.shots[state.currentIdx] = {
        rawUrl,
        nobgUrl,
        useNobg: Boolean(nobgUrl)
      };

      refreshTabsUI();
      openConfirmModal(state.currentIdx);
    } finally {
      loadingEl.classList.remove("show");
      state.isProcessing = false;
    }
  });

  // 10. 全部重設
  document.getElementById("btn-reset-all").addEventListener("click", () => {
    if (!confirm("確定清空目前 4 張照片並解除上下高度鎖定嗎？")) return;
    state.shots.forEach(s => {
      if (s?.rawUrl) URL.revokeObjectURL(s.rawUrl);
      if (s?.nobgUrl) URL.revokeObjectURL(s.nobgUrl);
    });
    state.shots = [null, null, null, null];
    state.currentIdx = 0;
    setVerticalLock(false);
    state.ghostMode = 0;
    document.getElementById("btn-ghost-toggle").textContent = GHOST_LEVELS[0].label;
    statusPill.textContent = "已重設！拖動四邊框線貼齊家具四邊後按快門";
    refreshTabsUI();
  });

  // 11. 合成指定底色的最終 PNG Bytes（支援透明底 / 純白底 / 任意色底）
  async function renderShotWithBgBytes(shot, bgColor) {
    const srcUrl = getActiveShotUrl(shot);
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = srcUrl;
    });

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");

    if (bgColor && bgColor !== "transparent") {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(img, 0, 0);

    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    const buf = await blob.arrayBuffer();
    return new Uint8Array(buf);
  }

  // 12. 零依賴 ZIP 打包器
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZipBlob(entries) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    entries.forEach(({ name, data }) => {
      const nameBytes = enc.encode(name);
      const sum = crc32(data);

      const lh = new ArrayBuffer(30 + nameBytes.length);
      const lv = new DataView(lh);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint32(14, sum, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      new Uint8Array(lh, 30).set(nameBytes);
      localParts.push(new Uint8Array(lh), data);

      const ch = new ArrayBuffer(46 + nameBytes.length);
      const cv = new DataView(ch);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint32(16, sum, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      new Uint8Array(ch, 46).set(nameBytes);
      centralParts.push(new Uint8Array(ch));

      offset += lh.byteLength + data.length;
    });

    const cdSize = centralParts.reduce((s, p) => s + p.length, 0);
    const eocd = new ArrayBuffer(22);
    const ev = new DataView(eocd);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd)], { type: "application/zip" });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // 13. 四向總覽與下載視窗
  function openReviewModal() {
    const base = getCleanBaseName();
    const grid = document.getElementById("compare-grid");
    grid.innerHTML = ANGLES.map(a => {
      const shot = state.shots[a.idx];
      const url = getActiveShotUrl(shot);
      return `
        <div class="compare-card">
          <div class="compare-img-wrap ${state.bgColor === "transparent" ? "checker-bg" : ""}" style="${state.bgColor !== "transparent" ? `background-color:${state.bgColor};` : ""}">
            ${url ? `<img src="${url}" alt="${a.label}" />` : `<span style="color:#6b7280;font-size:12px;margin:auto;">尚未拍攝</span>`}
          </div>
          <div class="compare-meta">
            <span style="font-weight:700;color:#e5e7eb;">${a.label}</span>
            <button class="btn-dl-one" data-idx="${a.idx}" ${shot ? "" : "disabled"}>⬇️ 單張</button>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".btn-dl-one").forEach(btn => {
      btn.addEventListener("click", async () => {
        const idx = parseInt(btn.dataset.idx);
        const shot = state.shots[idx];
        if (!shot) return;
        const bytes = await renderShotWithBgBytes(shot, state.bgColor);
        downloadBlob(new Blob([bytes], { type: "image/png" }), `${base}${ANGLES[idx].suffix}.png`);
      });
    });

    document.getElementById("review-modal").classList.add("show");
  }

  document.getElementById("btn-review").addEventListener("click", openReviewModal);
  document.getElementById("btn-close-review").addEventListener("click", () => {
    document.getElementById("review-modal").classList.remove("show");
  });

  document.getElementById("btn-dl-zip").addEventListener("click", async () => {
    const base = getCleanBaseName();
    const btnZip = document.getElementById("btn-dl-zip");
    const entries = [];

    btnZip.disabled = true;
    btnZip.textContent = "⏳ 正在合成圖檔並打包 ZIP...";

    try {
      for (const a of ANGLES) {
        const shot = state.shots[a.idx];
        if (!shot) continue;
        const data = await renderShotWithBgBytes(shot, state.bgColor);
        entries.push({
          name: `${base}${a.suffix}.png`,
          data
        });
      }

      if (!entries.length) {
        alert("尚未拍攝任何照片！");
        return;
      }

      const zipBlob = buildZipBlob(entries);
      downloadBlob(zipBlob, `${base}_4向素材.zip`);
    } finally {
      btnZip.disabled = false;
      btnZip.textContent = "📦 一鍵打包下載 ZIP（全部已拍圖檔）";
    }
  });

  updateCropBoxUI();
  refreshTabsUI();
  startCamera();
</script>
</body>
</html>
