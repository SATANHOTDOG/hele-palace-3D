<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>和樂宮 3D｜四向家具精準裁切相機</title>
  <style>
    :root {
      --bg: #0e1116;
      --border: #333b48;
      --gold: #f5b942;
      --green: #22c55e;
      --cyan: #38bdf8;
      --text: #f3f4f6;
      --sub: #9ca3af;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }

    /* ================= 頂部設定列 ================= */
    #top-bar {
      flex: 0 0 auto;
      background: #161a22;
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 25;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .name-row label {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
    }

    #base-filename {
      flex: 1;
      background: #0d1015;
      border: 1px solid #444e5e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
      user-select: text;
      min-width: 0;
    }
    #base-filename:focus { border-color: var(--gold); }

    .btn-mini {
      background: #252c37;
      border: 1px solid #444e5e;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .angle-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .angle-tab {
      background: #1e232d;
      border: 1.5px solid #353e4d;
      border-radius: 7px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .angle-tab.active {
      border-color: var(--gold);
      background: rgba(245, 185, 66, 0.16);
    }
    .angle-tab.done {
      border-color: var(--green);
    }
    .angle-tab .deg {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }
    .angle-tab .fname {
      font-size: 9.5px;
      color: var(--sub);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .angle-tab .badge {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 9px;
    }

    /* ================= 主體工作區（直向：上下排；橫向：左右排） ================= */
    #main-stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    #viewfinder {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #cam-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #ghost-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      mix-blend-mode: screen;
      z-index: 4;
    }

    /* ================= 四邊暗化遮罩（框外變暗，框內即最終成品） ================= */
    .crop-mask {
      position: absolute;
      background: rgba(0, 0, 0, 0.62);
      pointer-events: none;
      z-index: 5;
    }
    #mask-top { top: 0; left: 0; right: 0; }
    #mask-bottom { bottom: 0; left: 0; right: 0; }
    #mask-left { left: 0; }
    #mask-right { right: 0; }

    /* 中央垂直與水平參考線 */
    #guide-center-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      border-left: 1px dashed rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 6;
    }

    #roll-level-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 20px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
    }
    #roll-bar {
      width: 84px;
      height: 2.5px;
      border-radius: 2px;
      background: rgba(245, 185, 66, 0.8);
      transition: transform 0.06s linear, background 0.15s;
    }
    #roll-bar.level {
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
    }

    /* ================= 可拖曳的四條裁切線 ================= */
    .drag-hline {
      position: absolute;
      left: 0;
      right: 0;
      height: 32px;
      margin-top: -16px;
      cursor: ns-resize;
      z-index: 12;
      display: flex;
      align-items: center;
    }
    .drag-hline .bar {
      width: 100%;
      height: 2.5px;
    }

    #line-top .bar { background: var(--gold); box-shadow: 0 0 6px #000; }
    #line-top .tag {
      position: absolute;
      left: 8px;
      top: -12px;
      font-size: 10.5px;
      font-weight: 800;
      color: #111;
      background: var(--gold);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    #line-bottom .bar { background: var(--green); box-shadow: 0 0 6px #000; }
    #line-bottom .tag {
      position: absolute;
      left: 8px;
      top: 17px;
      font-size: 10.5px;
      font-weight: 800;
      color: #052e16;
      background: var(--green);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .drag-vline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32px;
      margin-left: -16px;
      cursor: ew-resize;
      z-index: 12;
      display: flex;
      justify-content: center;
    }
    .drag-vline .bar {
      height: 100%;
      width: 2.5px;
      background: var(--cyan);
      box-shadow: 0 0 6px #000;
    }
    .drag-vline .vtag {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 800;
      color: #082f49;
      background: var(--cyan);
      padding: 3px 4px;
      border-radius: 4px;
      pointer-events: none;
    }

    #status-pill {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 18, 24, 0.88);
      border: 1px solid var(--border);
      color: #fef3c7;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 94%;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 16;
    }

    /* ================= 快門與操作列 ================= */
    #control-bar {
      flex: 0 0 auto;
      background: #161a22;
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .btn-sub {
      flex: 1;
      padding: 9px 6px;
      border-radius: 9px;
      border: 1px solid #444e5e;
      background: #232a35;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .btn-sub.ready {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: #4ade80;
      color: #fff;
    }

    #shutter-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #4b5563;
      box-shadow: 0 0 0 3px rgba(245, 185, 66, 0.55);
      cursor: pointer;
      flex: 0 0 auto;
      transition: transform 0.08s;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      background: var(--gold);
    }

    /* 橫向握持時自動把快門列移到右側，保留最大上下取景高度 */
    @media (orientation: landscape) {
      #top-bar {
        flex-direction: row;
        align-items: center;
        padding: 4px 10px;
        gap: 8px;
      }
      .name-row { flex: 0 0 240px; }
      .angle-tabs { flex: 1; }
      .angle-tab { padding: 2px 4px; }
      #main-stage { flex-direction: row; }
      #control-bar {
        flex-direction: column;
        width: 88px;
        border-top: none;
        border-left: 1px solid var(--border);
        padding: 10px 6px;
        padding-right: calc(6px + var(--safe-right));
      }
      .btn-sub {
        flex: 0 0 auto;
        width: 100%;
        font-size: 11px;
        padding: 8px 4px;
        white-space: normal;
        line-height: 1.25;
      }
    }

    /* ================= 四向並排檢查與下載視窗 ================= */
    #review-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 50;
      backdrop-filter: blur(5px);
    }
    #review-modal.show { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 92dvh;
      background: #1a2029;
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      padding: 10px 14px;
      background: #222935;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 {
      margin: 0;
      font-size: 15px;
      color: var(--gold);
    }

    .modal-body {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .compare-card {
      background: #101318;
      border: 1px solid #353e4d;
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .compare-img-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: repeating-conic-gradient(#1f242d 0% 25%, #171b22 0% 50%) 50% / 14px 14px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .compare-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .compare-img-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--green);
    }

    .compare-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
    }

    .btn-dl-one {
      background: #0284c7;
      border: none;
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-dl-one:disabled {
      background: #374151;
      color: #9ca3af;
    }

    .btn-dl-all {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- 頂部設定與四向狀態 -->
  <header id="top-bar">
    <div class="name-row">
      <label for="base-filename">檔名</label>
      <input type="text" id="base-filename" value="LaZBoy" placeholder="例: LaZBoy" />
      <button class="btn-mini" id="btn-ghost-toggle">👻 殘影: 關</button>
      <button class="btn-mini" id="btn-reset-all">🗑️ 重設</button>
    </div>
    <div class="angle-tabs" id="angle-tabs">
      <div class="angle-tab active" data-idx="0">
        <span class="badge" id="badge-0"></span>
        <span class="deg">0° 正面</span>
        <span class="fname" id="fname-0">LaZBoy.png</span>
      </div>
      <div class="angle-tab" data-idx="1">
        <span class="badge" id="badge-1"></span>
        <span class="deg">90° 右側</span>
        <span class="fname" id="fname-1">LaZBoy_90.png</span>
      </div>
      <div class="angle-tab" data-idx="2">
        <span class="badge" id="badge-2"></span>
        <span class="deg">180° 背面</span>
        <span class="fname" id="fname-2">LaZBoy_180.png</span>
      </div>
      <div class="angle-tab" data-idx="3">
        <span class="badge" id="badge-3"></span>
        <span class="deg">270° 左側</span>
        <span class="fname" id="fname-3">LaZBoy_270.png</span>
      </div>
    </div>
  </header>

  <div id="main-stage">
    <!-- 相機取景區 -->
    <main id="viewfinder">
      <video id="cam-video" autoplay playsinline muted></video>
      <img id="ghost-overlay" alt="" />

      <!-- 四邊暗化遮罩 -->
      <div class="crop-mask" id="mask-top"></div>
      <div class="crop-mask" id="mask-bottom"></div>
      <div class="crop-mask" id="mask-left"></div>
      <div class="crop-mask" id="mask-right"></div>

      <div id="guide-center-v"></div>
      <div id="roll-level-wrap"><div id="roll-bar"></div></div>

      <!-- 四條可拖曳裁切線 -->
      <div class="drag-hline" id="line-top">
        <div class="bar"></div>
        <span class="tag">▲ 拖曳貼齊椅背頂端</span>
      </div>
      <div class="drag-hline" id="line-bottom">
        <div class="bar"></div>
        <span class="tag">▼ 拖曳貼齊底座觸地線</span>
      </div>
      <div class="drag-vline" id="line-left">
        <div class="bar"></div>
        <span class="vtag">◀</span>
      </div>
      <div class="drag-vline" id="line-right">
        <div class="bar"></div>
        <span class="vtag">▶</span>
      </div>

      <div id="status-pill">拖動四邊框線緊貼沙發四邊（亮區即為最終裁切成品）</div>
    </main>

    <!-- 快門與預覽列 -->
    <footer id="control-bar">
      <button class="btn-sub" id="btn-sensor">📐 水平儀</button>
      <button id="shutter-btn" title="拍照"></button>
      <button class="btn-sub" id="btn-review">🖼️ 檢視/下載 (0/4)</button>
    </footer>
  </div>
</div>

<!-- 四向並排檢查與下載視窗 -->
<div id="review-modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>📐 四向精準裁切檢查與打包下載</h3>
      <button class="btn-mini" id="btn-close-review">✕ 關閉</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:#d1d5db;line-height:1.45;">
        以下四張即為框線內裁切出的成品（底邊已精準切齊綠線）。確認無誤後點下方按鈕打包下載 ZIP：
      </div>
      <div class="compare-grid" id="compare-grid"></div>
      <button class="btn-dl-all" id="btn-dl-zip">📦 一鍵打包下載 ZIP（4張全收）</button>
      <div style="font-size:11px;color:#9ca3af;text-align:center;">
        下載 ZIP 後在手機「我的檔案」解壓縮，再用相簿長按沙發主體去背（或 PhotoRoom）即可上傳 GitHub。
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const ANGLES = [
    { idx: 0, label: "0° 正面", suffix: "" },
    { idx: 1, label: "90° 右側", suffix: "_90" },
    { idx: 2, label: "180° 背面", suffix: "_180" },
    { idx: 3, label: "270° 左側", suffix: "_270" }
  ];

  const state = {
    currentIdx: 0,
    shots: [null, null, null, null],
    topPct: 22,
    bottomPct: 82,
    leftPct: 12,
    rightPct: 88,
    verticalLocked: false,
    ghostMode: 0
  };

  const video = document.getElementById("cam-video");
  const viewfinder = document.getElementById("viewfinder");
  const ghostImg = document.getElementById("ghost-overlay");
  const statusPill = document.getElementById("status-pill");
  const baseInput = document.getElementById("base-filename");

  const lineTop = document.getElementById("line-top");
  const lineBottom = document.getElementById("line-bottom");
  const lineLeft = document.getElementById("line-left");
  const lineRight = document.getElementById("line-right");

  const maskTop = document.getElementById("mask-top");
  const maskBottom = document.getElementById("mask-bottom");
  const maskLeft = document.getElementById("mask-left");
  const maskRight = document.getElementById("mask-right");

  // 1. 啟動後置鏡頭
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
    } catch (err) {
      statusPill.textContent = "⚠️ 無法開啟相機，請確認網址為 HTTPS 並允許相機權限";
    }
  }

  // 2. 左右水平儀（避免寬沙發拍歪切腳）
  function handleOrientation(e) {
    if (typeof e.beta !== "number" || typeof e.gamma !== "number") return;
    const isLandscape = window.innerWidth > window.innerHeight;
    const roll = isLandscape ? e.beta : e.gamma;
    const rollBar = document.getElementById("roll-bar");
    const clamped = Math.max(-20, Math.min(20, roll));
    rollBar.style.transform = `rotate(${-clamped}deg)`;
    rollBar.classList.toggle("level", Math.abs(roll) <= 1.8);
  }

  window.addEventListener("deviceorientation", handleOrientation);
  document.getElementById("btn-sensor").addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          statusPill.textContent = "✅ 已啟用水平儀（中央橫線變綠代表端平）";
        }
      } catch (_) {}
    } else {
      statusPill.textContent = "✅ 水平儀運作中（中央橫線變綠代表手機左右端平）";
    }
  });

  // 3. 更新四邊框線與暗化遮罩（精準 1:1 呈現實際裁切範圍）
  function updateCropBoxUI() {
    lineTop.style.top = `${state.topPct}%`;
    lineBottom.style.top = `${state.bottomPct}%`;
    lineLeft.style.left = `${state.leftPct}%`;
    lineRight.style.left = `${state.rightPct}%`;

    maskTop.style.height = `${state.topPct}%`;
    maskBottom.style.height = `${100 - state.bottomPct}%`;

    const midTop = `${state.topPct}%`;
    const midHeight = `${state.bottomPct - state.topPct}%`;
    maskLeft.style.top = midTop;
    maskLeft.style.height = midHeight;
    maskLeft.style.width = `${state.leftPct}%`;

    maskRight.style.top = midTop;
    maskRight.style.height = midHeight;
    maskRight.style.width = `${100 - state.rightPct}%`;

    // 洋蔥皮殘影對齊在框內位置
    ghostImg.style.left = `${state.leftPct}%`;
    ghostImg.style.top = `${state.topPct}%`;
    ghostImg.style.width = `${state.rightPct - state.leftPct}%`;
    ghostImg.style.height = `${state.bottomPct - state.topPct}%`;
  }

  function bindEdgeDrag(el, edge) {
    let dragging = false;
    const onMove = (clientX, clientY) => {
      if (!dragging) return;
      const rect = viewfinder.getBoundingClientRect();
      const xPct = ((clientX - rect.left) / rect.width) * 100;
      const yPct = ((clientY - rect.top) / rect.height) * 100;

      if (edge === "top" || edge === "bottom") {
        if (state.verticalLocked) {
          statusPill.textContent = "🔒 上下高度已依第 1 張鎖定（左右藍線仍可調整，或按「重設」解鎖）";
          dragging = false;
          return;
        }
        if (edge === "top") {
          state.topPct = Math.max(2, Math.min(state.bottomPct - 10, yPct));
        } else {
          state.bottomPct = Math.min(98, Math.max(state.topPct + 10, yPct));
        }
      } else if (edge === "left") {
        state.leftPct = Math.max(2, Math.min(state.rightPct - 10, xPct));
      } else if (edge === "right") {
        state.rightPct = Math.min(98, Math.max(state.leftPct + 10, xPct));
      }
      updateCropBoxUI();
    };

    el.addEventListener("touchstart", (e) => { dragging = true; e.preventDefault(); }, { passive: false });
    window.addEventListener("touchmove", (e) => {
      if (dragging && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("touchend", () => { dragging = false; });

    el.addEventListener("mousedown", () => { dragging = true; });
    window.addEventListener("mousemove", (e) => {
      if (dragging) onMove(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", () => { dragging = false; });
  }

  bindEdgeDrag(lineTop, "top");
  bindEdgeDrag(lineBottom, "bottom");
  bindEdgeDrag(lineLeft, "left");
  bindEdgeDrag(lineRight, "right");

  // 4. 檔名與分頁更新
  function getCleanBaseName() {
    return (baseInput.value.trim() || "Furniture").replace(/[^a-zA-Z0-9_-]/g, "");
  }

  function refreshTabsUI() {
    const base = getCleanBaseName();
    ANGLES.forEach(a => {
      const tab = document.querySelector(`.angle-tab[data-idx="${a.idx}"]`);
      const fnameEl = document.getElementById(`fname-${a.idx}`);
      const badgeEl = document.getElementById(`badge-${a.idx}`);
      fnameEl.textContent = `${base}${a.suffix}.png`;
      tab.classList.toggle("active", state.currentIdx === a.idx);
      const hasShot = Boolean(state.shots[a.idx]);
      tab.classList.toggle("done", hasShot);
      badgeEl.textContent = hasShot ? "✅" : "";
    });

    const count = state.shots.filter(Boolean).length;
    const reviewBtn = document.getElementById("btn-review");
    reviewBtn.textContent = `🖼️ 檢視/下載 (${count}/4)`;
    reviewBtn.classList.toggle("ready", count === 4);

    updateGhostOverlay();
  }

  baseInput.addEventListener("input", refreshTabsUI);

  document.querySelectorAll(".angle-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.currentIdx = parseInt(tab.dataset.idx);
      refreshTabsUI();
      statusPill.textContent = `目前角度：${ANGLES[state.currentIdx].label}（調整左右藍線夾緊家具寬度）`;
    });
  });

  // 5. 洋蔥皮殘影
  const GHOST_LEVELS = [
    { opacity: 0, label: "👻 殘影: 關" },
    { opacity: 0.3, label: "👻 殘影: 30%" },
    { opacity: 0.5, label: "👻 殘影: 50%" }
  ];

  function updateGhostOverlay() {
    const refShot = state.shots[0] || state.shots.find(Boolean);
    const level = GHOST_LEVELS[state.ghostMode];
    if (refShot && level.opacity > 0 && state.currentIdx !== 0) {
      ghostImg.src = refShot;
      ghostImg.style.opacity = String(level.opacity);
    } else {
      ghostImg.style.opacity = "0";
    }
  }

  document.getElementById("btn-ghost-toggle").addEventListener("click", () => {
    state.ghostMode = (state.ghostMode + 1) % GHOST_LEVELS.length;
    document.getElementById("btn-ghost-toggle").textContent = GHOST_LEVELS[state.ghostMode].label;
    updateGhostOverlay();
  });

  // 6. 快門拍照（精準 1:1 裁切亮框區域，不額外多留任何牆壁或地板）
  document.getElementById("shutter-btn").addEventListener("click", () => {
    if (!video.videoWidth || !video.videoHeight) {
      statusPill.textContent = "⏳ 相機畫面尚未就緒，請稍候...";
      return;
    }

    const viewW = viewfinder.clientWidth;
    const viewH = viewfinder.clientHeight;
    const vidRatio = video.videoWidth / video.videoHeight;
    const viewRatio = viewW / viewH;

    let visibleVidX = 0, visibleVidY = 0, visibleVidW = video.videoWidth, visibleVidH = video.videoHeight;
    if (vidRatio > viewRatio) {
      visibleVidW = video.videoHeight * viewRatio;
      visibleVidX = (video.videoWidth - visibleVidW) / 2;
    } else {
      visibleVidH = video.videoWidth / viewRatio;
      visibleVidY = (video.videoHeight - visibleVidH) / 2;
    }

    const cropX = visibleVidX + visibleVidW * (state.leftPct / 100);
    const cropY = visibleVidY + visibleVidH * (state.topPct / 100);
    const cropW = visibleVidW * ((state.rightPct - state.leftPct) / 100);
    const cropH = visibleVidH * ((state.bottomPct - state.topPct) / 100);

    const maxDim = 1280;
    let outW = Math.max(10, Math.round(cropW));
    let outH = Math.max(10, Math.round(cropH));
    if (Math.max(outW, outH) > maxDim) {
      const scale = maxDim / Math.max(outW, outH);
      outW = Math.round(outW * scale);
      outH = Math.round(outH * scale);
    }

    const capCanvas = document.createElement("canvas");
    capCanvas.width = outW;
    capCanvas.height = outH;
    const cctx = capCanvas.getContext("2d");
    cctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

    state.shots[state.currentIdx] = capCanvas.toDataURL("image/png");

    // 拍下第 1 張後鎖定上下橘綠線（保證四張高度與地板齊平），左右藍線維持自由調整
    if (!state.verticalLocked) {
      state.verticalLocked = true;
    }

    const nextEmpty = state.shots.findIndex((s, i) => i > state.currentIdx && !s);
    const anyEmpty = state.shots.findIndex(s => !s);
    if (nextEmpty !== -1) {
      state.currentIdx = nextEmpty;
      statusPill.textContent = `✅ 已裁切保存！請拍【${ANGLES[state.currentIdx].label}】（可拖動左右藍線貼緊側面）`;
    } else if (anyEmpty !== -1) {
      state.currentIdx = anyEmpty;
      statusPill.textContent = `✅ 已裁切保存！請補拍【${ANGLES[state.currentIdx].label}】`;
    } else {
      statusPill.textContent = "🎉 四向全部裁切完成！請點「檢視/下載」打包 ZIP";
    }

    refreshTabsUI();
  });

  // 7. 全部重設
  document.getElementById("btn-reset-all").addEventListener("click", () => {
    if (!confirm("確定清空目前 4 張照片並解除上下高度鎖定嗎？")) return;
    state.shots = [null, null, null, null];
    state.currentIdx = 0;
    state.verticalLocked = false;
    state.ghostMode = 0;
    document.getElementById("btn-ghost-toggle").textContent = GHOST_LEVELS[0].label;
    statusPill.textContent = "已重設！拖動四邊框線緊貼沙發四邊後按快門";
    refreshTabsUI();
  });

  // 8. 零依賴 ZIP 打包器（一次下載全部 4 張 PNG）
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dataUrlToBytes(dataUrl) {
    const bin = atob(dataUrl.split(",")[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function buildZipBlob(entries) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    entries.forEach(({ name, data }) => {
      const nameBytes = enc.encode(name);
      const sum = crc32(data);

      const lh = new ArrayBuffer(30 + nameBytes.length);
      const lv = new DataView(lh);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint32(14, sum, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      new Uint8Array(lh, 30).set(nameBytes);
      localParts.push(new Uint8Array(lh), data);

      const ch = new ArrayBuffer(46 + nameBytes.length);
      const cv = new DataView(ch);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint32(16, sum, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      new Uint8Array(ch, 46).set(nameBytes);
      centralParts.push(new Uint8Array(ch));

      offset += lh.byteLength + data.length;
    });

    const cdSize = centralParts.reduce((s, p) => s + p.length, 0);
    const eocd = new ArrayBuffer(22);
    const ev = new DataView(eocd);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd)], { type: "application/zip" });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // 9. 檢視與下載視窗
  document.getElementById("btn-review").addEventListener("click", () => {
    const base = getCleanBaseName();
    const grid = document.getElementById("compare-grid");
    grid.innerHTML = ANGLES.map(a => {
      const shot = state.shots[a.idx];
      return `
        <div class="compare-card">
          <div class="compare-img-wrap">
            ${shot ? `<img src="${shot}" alt="${a.label}" />` : `<span style="color:#6b7280;font-size:12px;margin:auto;">尚未拍攝</span>`}
          </div>
          <div class="compare-meta">
            <span style="font-weight:700;color:#e5e7eb;">${a.label}</span>
            <button class="btn-dl-one" data-idx="${a.idx}" ${shot ? "" : "disabled"}>⬇️ 單張</button>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".btn-dl-one").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.idx);
        const shot = state.shots[idx];
        if (shot) {
          const blob = new Blob([dataUrlToBytes(shot)], { type: "image/png" });
          downloadBlob(blob, `${base}${ANGLES[idx].suffix}.png`);
        }
      });
    });

    document.getElementById("review-modal").classList.add("show");
  });

  document.getElementById("btn-close-review").addEventListener("click", () => {
    document.getElementById("review-modal").classList.remove("show");
  });

  document.getElementById("btn-dl-zip").addEventListener("click", () => {
    const base = getCleanBaseName();
    const entries = [];
    ANGLES.forEach(a => {
      const shot = state.shots[a.idx];
      if (shot) {
        entries.push({
          name: `${base}${a.suffix}.png`,
          data: dataUrlToBytes(shot)
        });
      }
    });
    if (!entries.length) {
      alert("尚未拍攝任何照片！");
      return;
    }
    const zipBlob = buildZipBlob(entries);
    downloadBlob(zipBlob, `${base}_4向素材.zip`);
  });

  updateCropBoxUI();
  refreshTabsUI();
  startCamera();
})();
</script>
</body>
</html>
